<li>{% assign entry = include.item %}
  <a {% unless entry.platform == 'rss' %}rel="me" {% endunless %}{% if entry.platform == 'email' %}class="u-email" {% endif %}href="{{ entry.user_url }}"{% unless entry.platform == 'email' %} target="_blank"{% endunless %} title="{{ entry.title | default: entry.platform }}">
    <svg class="svg-icon grey">
      <use xlink:href="{{ '/assets/minima-social-icons.svg#' | append: entry.platform | relative_url }}"></use>
    </svg>
  </a>
</li>
