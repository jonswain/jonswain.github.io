# Interactive visualisations listed on /visualisations/ (newest first).
# Each page is a self-contained HTML file in visualisations/<slug>/index.html, built from its
# source project with `scripts/build_report.py --standalone <path>` (or build_wbt_report.py for
# World Best Time Difficulty).
- title: "Erg Test Calculator"
  date: 2026-10-21
  url: /visualisations/erg-test-calculator/
  preview: "Predict an erg time or split for any distance or duration from one or more recent tests. A Bayesian model learned from 42,000 Concept2 Logbook athletes who ranked several events adapts to your own speed and fade, with training paces, critical power, a pacing plan and your erg fingerprint."
  image: /images/visualisations/erg-test-calculator.png
  alt: "Erg test calculator predicting a 4,000 m time from a 2k and a 6k"
- title: "World Best Time Difficulty"
  date: 2026-10-19
  url: /visualisations/world-best-times/
  preview: "Which rowing world best times are hardest to beat? Every elite record split into the crew and the day, with record histories, unlucky and great crews, the records most likely to fall in 2027, pacing, wind, venues and countries."
  image: /images/visualisations/world-best-times.png
  alt: "Bar chart splitting each world best time into conditions and crew"
- title: "Row vs Run"
  date: 2026-10-14
  url: /visualisations/row-vs-run/
  preview: "Is a Concept2 erg time faster than a running time over the same distance? Only at the very top: world-best runners leave the erg behind, but rowing is faster for almost everyone else, from 100 m to the marathon."
  image: /images/visualisations/row-vs-run.png
  alt: "Heatmap of running vs erg speed by distance and standard"
- title: "NZ Champs Speed Tables"
  date: 2026-10-14
  url: /visualisations/nz-champs-speed-tables/
  preview: "NZ Rowing Championships, Maadi Cup and NZ Masters finals turned into condition-adjusted speed factors, with a crew-comparison calculator, world-best and masters-handicap comparisons, and analysis of conditions, lanes and close racing."
  image: /images/visualisations/nz-champs-speed-tables.png
  alt: "Grade factor matrix from the NZ Champs Speed Tables"
