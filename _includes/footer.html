<footer class="site-footer h-card">
  <data class="u-url" value="{{ "/" | relative_url }}"></data>

  <div class="wrapper">

    <p class="footer-license">
      Text and figures are licensed under
      <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>.
      Code snippets are licensed under the
      <a href="https://opensource.org/licenses/MIT" rel="license">MIT License</a>
      unless otherwise noted.
    </p>

    <div class="footer-col-wrapper">
      <div class="footer-col">
        <div class="center">
          <p class="feed-subscribe">
            <a href="{{ site.feed.path | default: 'feed.xml' | absolute_url }}">
              <svg class="svg-icon orange">
                <use xlink:href="{{ 'assets/minima-social-icons.svg#rss' | relative_url }}"></use>
              </svg><span>Subscribe</span>
            </a>
          </p>
        </div>
        <div class="social-links">
          {%- include social.html -%}
        </div>
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

  </div>

</footer>
